# Render Blueprint for the Global Connects Lead Engine.
# Deploy: Render → New + → Blueprint → select this repo → Apply.
# Render provisions Postgres + the API, runs migrations on start, generates secrets.
# Spec: https://render.com/docs/blueprint-spec

databases:
  - name: leadengine-db
    databaseName: leadengine
    user: leadengine
    plan: free                       # free Postgres expires after 90 days; upgrade for production

services:
  - type: web
    name: leadengine-api
    runtime: docker
    # Paths are relative to the repository root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # No dockerCommand override: Render exec's it as bare argv (no shell), so
    # `&&` and `$PORT` don't work there. The Dockerfile's shell-form CMD handles
    # migrations + serving on $PORT instead.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadengine-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD           # auto-generated; view/rotate in the Render dashboard
        generateValue: true
      - key: WEBHOOK_SECRET           # auto-generated; used by the funnel's leadEndpoint
        generateValue: true
      - key: HOT_LEAD_NOTIFY_THRESHOLD
        value: "70"
      - key: CORS_ALLOW_ORIGINS       # lock to your funnel's domain once it's live
        value: "*"
      - key: CRM_PROVIDER
        value: none
      - key: EMAIL_PROVIDER
        value: none
      - key: ENRICHMENT_PROVIDER
        value: none

  # The static assessment funnel. Publishes only the funnel assets (not the
  # backend source) into ./public. Its leadEndpoint is already wired to the API.
  - type: web
    name: leadengine-funnel
    runtime: static
    buildCommand: "mkdir -p public && cp -r index.html tracker.html css js assets public/"
    staticPublishPath: ./public
