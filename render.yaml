# Render Blueprint for the Global Connects Lead Engine.
# Deploy: Render → New + → Blueprint → select this repo → Apply.
# Render provisions Postgres + the API, runs migrations on start, generates secrets.
# Spec: https://render.com/docs/blueprint-spec

databases:
  - name: leadengine-db
    databaseName: leadengine
    user: leadengine
    plan: free                       # free Postgres expires after 90 days; upgrade for production

  # Postgres for the Client Intelligence Portal. pgvector is enabled by the
  # portal's first migration (CREATE EXTENSION vector); Render's Postgres ships
  # with pgvector available.
  - name: portal-db
    databaseName: portal
    user: portal
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: leadengine-api
    runtime: docker
    # Paths are relative to the repository root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # No dockerCommand override: Render exec's it as bare argv (no shell), so
    # `&&` and `$PORT` don't work there. The Dockerfile's shell-form CMD handles
    # migrations + serving on $PORT instead.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadengine-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD           # auto-generated; view/rotate in the Render dashboard
        generateValue: true
      - key: WEBHOOK_SECRET           # auto-generated; used by the funnel's leadEndpoint
        generateValue: true
      - key: HOT_LEAD_NOTIFY_THRESHOLD
        value: "70"
      - key: CORS_ALLOW_ORIGINS       # lock to your funnel's domain once it's live
        value: "*"
      - key: CRM_PROVIDER
        value: none
      - key: EMAIL_PROVIDER
        value: none
      - key: ENRICHMENT_PROVIDER
        value: none

  # The static assessment funnel. Publishes only the funnel assets (not the
  # backend source) into ./public. Its leadEndpoint is already wired to the API.
  - type: web
    name: leadengine-funnel
    runtime: static
    buildCommand: "mkdir -p public && cp -r index.html tracker.html css js assets public/"
    staticPublishPath: ./public

  # ---------------------------------------------------------------------------
  # Client Intelligence Portal (Next.js).
  #
  # As shipped this deploys in DEMO mode: mock AI + local (ephemeral) storage +
  # dev auth, so you can click around immediately with zero cloud setup. The job
  # worker runs inside this web service (RUN_WORKER_IN_WEB), so no extra service
  # is needed. Migrations run on every deploy via preDeployCommand.
  #
  # DEMO login: after the first deploy, open the service Shell and run
  # `npm run seed` — it prints the demo logins (admin@globalconnects.local + the
  # generated SEED_ADMIN_PASSWORD from this service's Environment tab).
  #
  # To go to PRODUCTION: delete the DEMO block below, uncomment the PRODUCTION
  # block, set the secret values (sync:false → filled in the dashboard), and set
  # AWS Bedrock + S3/KMS + Cognito. See docs/portal/DEPLOY_RENDER.md.
  # ---------------------------------------------------------------------------
  - type: web
    name: gc-portal
    runtime: docker
    dockerfilePath: ./portal/Dockerfile
    dockerContext: ./portal
    plan: free                       # free spins down when idle + limited RAM; upgrade for production
    healthCheckPath: /api/health
    preDeployCommand: "npx prisma migrate deploy"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: portal-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # After the first deploy, set this to your real service URL and redeploy.
      - key: NEXT_PUBLIC_APP_URL
        value: https://gc-portal.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: RUN_WORKER_IN_WEB       # process documents inside the web service
        value: "true"
      # --- DEMO block (remove for production) ---
      - key: ALLOW_INSECURE_DEMO
        value: "true"
      - key: ENABLE_DEV_AUTH
        value: "true"
      - key: AI_DRIVER
        value: mock
      - key: STORAGE_DRIVER
        value: local
      - key: SEED_ADMIN_EMAIL
        value: admin@globalconnects.local
      - key: SEED_ADMIN_PASSWORD     # auto-generated; view in the Environment tab
        generateValue: true
      # --- PRODUCTION block (uncomment; fill secrets in the dashboard) ---
      # - key: ENABLE_DEV_AUTH
      #   value: "false"
      # - key: AI_DRIVER
      #   value: bedrock
      # - key: STORAGE_DRIVER
      #   value: s3
      # - key: AWS_REGION
      #   value: us-east-1
