<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Federal Contracting Readiness Assessment</title>
  <meta name="description" content="Free 2-minute assessment: get your Federal Contracting Readiness Score and a tailored action plan to start winning government contracts." />
  <link rel="stylesheet" href="css/leadgen.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" id="brandMark">🎯</span>
        <span class="brand-name" id="brandName">The Global Connects</span>
        <span class="brand-tag" id="brandTag">GovCon Advisory</span>
      </a>
      <a class="header-cta" href="#/assessment" data-start>Free readiness check</a>
    </div>
  </header>

  <main id="app"><!-- screens render here --></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span id="footerBrand">The Global Connects — GovCon Advisory</span>
      <nav class="footer-links">
        <a href="#/assessment" data-start>Take the assessment</a>
        <a href="#/leads" id="leadsLink">View captured leads</a>
        <a href="tracker.html">Internal bid tracker</a>
      </nav>
    </div>
  </footer>

  <!-- ===== Screen templates ===== -->

  <template id="tpl-landing">
    <section class="hero">
      <div class="wrap hero-inner">
        <div class="hero-copy">
          <span class="eyebrow">Free · 2 minutes · No signup to see your score</span>
          <h1 id="heroHeadline">Are you ready to win federal contracts?</h1>
          <p id="heroSub" class="lede"></p>
          <div class="hero-actions">
            <a class="btn primary lg" href="#/assessment" data-start>Start the free assessment →</a>
            <span class="hero-note">Instant score · Personalized action plan</span>
          </div>
          <ul class="trust-row">
            <li>✔ Registration &amp; eligibility</li>
            <li>✔ Set-aside strategy</li>
            <li>✔ Pipeline &amp; proposals</li>
          </ul>
        </div>
        <div class="hero-card">
          <div class="score-preview">
            <div class="ring ring-demo"><span>?</span></div>
            <p>Your Federal Contracting<br/>Readiness Score</p>
            <div class="mini-bars">
              <div><i style="width:70%"></i></div>
              <div><i style="width:45%"></i></div>
              <div><i style="width:85%"></i></div>
              <div><i style="width:55%"></i></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="wrap value-strip">
      <div class="value-item"><span>🧭</span><h3>Know where you stand</h3><p>A clear, scored picture of your readiness across the five areas that decide who wins.</p></div>
      <div class="value-item"><span>🎯</span><h3>Get a tailored plan</h3><p>Personalized recommendations based on your answers — in the right priority order.</p></div>
      <div class="value-item"><span>🤝</span><h3>Talk to an expert</h3><p>Option to book a free strategy call to turn your plan into pursued, winnable contracts.</p></div>
    </section>
  </template>

  <template id="tpl-assessment">
    <section class="wrap assess">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label"><span id="qCount"></span></div>
      <div id="questionBox" class="question-box"></div>
      <div class="assess-nav">
        <button class="btn ghost" id="backBtn">← Back</button>
        <div class="spacer"></div>
      </div>
    </section>
  </template>

  <template id="tpl-results">
    <section class="wrap results">
      <div class="results-head">
        <div class="ring" id="scoreRing"><span id="scoreNum">0</span><small>/100</small></div>
        <div class="results-headline">
          <span class="tier-pill" id="tierPill"></span>
          <h1 id="tierName"></h1>
          <p id="tierBlurb" class="lede"></p>
        </div>
      </div>

      <div class="results-grid">
        <div class="panel">
          <h2>Your readiness by category</h2>
          <div id="catBreakdown" class="cat-breakdown"></div>
        </div>
        <div class="panel highlight">
          <h2>Your top recommendations</h2>
          <ul id="recoList" class="reco-list"></ul>
        </div>
      </div>

      <div class="cta-band" id="ctaBand">
        <div>
          <h2 id="ctaTitle">Get your personalized action plan</h2>
          <p id="ctaText">See your full plan and get a free 30-minute strategy call. We'll map your fastest path to a winnable first (or next) federal contract.</p>
        </div>
        <a class="btn primary lg" href="#/plan" id="ctaBandBtn">Get my action plan →</a>
      </div>
    </section>
  </template>

  <template id="tpl-lead">
    <section class="wrap lead">
      <div class="lead-grid">
        <div class="lead-pitch">
          <span class="eyebrow">Almost there</span>
          <h1>Where should we send your action plan?</h1>
          <p class="lede">We'll email your personalized plan and reach out to schedule your free 30-minute strategy call. Your readiness profile comes with it, so the call starts where you actually are.</p>
          <ul class="check-list">
            <li>✔ Your full readiness breakdown</li>
            <li>✔ Prioritized next steps for your situation</li>
            <li>✔ A no-obligation strategy call</li>
          </ul>
        </div>
        <form class="lead-form" id="leadForm">
          <div class="field"><label>Full name *</label><input name="name" required autocomplete="name" /></div>
          <div class="field"><label>Work email *</label><input name="email" type="email" required autocomplete="email" /></div>
          <div class="field"><label>Company *</label><input name="company" required autocomplete="organization" /></div>
          <div class="field"><label>Phone <span class="opt">(optional)</span></label><input name="phone" type="tel" autocomplete="tel" /></div>
          <div class="field"><label>What's your #1 goal right now? <span class="opt">(optional)</span></label>
            <textarea name="goal" rows="2" placeholder="e.g. Win our first federal contract this year"></textarea></div>
          <button class="btn primary lg full" type="submit" id="leadSubmit">Send me my action plan →</button>
          <p class="fineprint">By submitting you agree to be contacted about your assessment. No spam.</p>
        </form>
      </div>
    </section>
  </template>

  <template id="tpl-thankyou">
    <section class="wrap thankyou">
      <div class="ty-card">
        <div class="ty-check">✓</div>
        <h1>You're all set, <span id="tyName">there</span>!</h1>
        <p class="lede">Your personalized action plan is on its way to <strong id="tyEmail"></strong>. We'll reach out shortly to schedule your free strategy call.</p>
        <div id="tyCalendar"></div>
        <div class="ty-contact" id="tyContact"></div>
        <a class="btn ghost" href="#/">← Back to start</a>
      </div>
    </section>
  </template>

  <template id="tpl-leads">
    <section class="wrap leads-admin">
      <div class="admin-head">
        <div>
          <h1>Captured leads</h1>
          <p class="muted" id="leadsMode"></p>
        </div>
        <div class="admin-actions">
          <button class="btn ghost" id="exportLeads">⬇ Export CSV</button>
          <button class="btn ghost danger" id="clearLeads">Clear</button>
        </div>
      </div>
      <div id="leadsTable"></div>
    </section>
  </template>

  <div id="toast" class="toast" hidden></div>

  <script src="js/assessment.js"></script>
  <script src="js/leadgen.js"></script>
</body>
</html>
