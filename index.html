<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Global Connects — Operations Command Center</title>
  <meta name="description" content="One place to keep up with everything running in your business: clients, projects, tasks, cash flow, and goals." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">🌐</span>
        <div class="brand-text">
          <strong>The Global Connects</strong>
          <small>Command Center</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview"><span>📊</span> Overview</button>
        <button class="nav-item" data-view="clients"><span>🤝</span> Clients</button>
        <button class="nav-item" data-view="projects"><span>📁</span> Projects</button>
        <button class="nav-item" data-view="tasks"><span>✅</span> Tasks</button>
        <button class="nav-item" data-view="finances"><span>💰</span> Finances</button>
        <button class="nav-item" data-view="goals"><span>🎯</span> Goals</button>
        <button class="nav-item" data-view="playbook"><span>📖</span> Playbook</button>
      </nav>
      <div class="sidebar-footer">
        <button id="exportBtn" class="ghost-btn" title="Download all data as JSON">⬇ Export</button>
        <button id="importBtn" class="ghost-btn" title="Load data from a JSON backup">⬆ Import</button>
        <input type="file" id="importFile" accept="application/json" hidden />
        <button id="resetBtn" class="ghost-btn danger" title="Clear all data and reload samples">↺ Reset demo</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Overview</h1>
        <div class="topbar-actions">
          <input type="search" id="globalSearch" placeholder="Search everything…" />
          <button id="newBtn" class="primary-btn">＋ New</button>
        </div>
      </header>
      <section id="viewRoot" class="view-root"><!-- views render here --></section>
    </main>
  </div>

  <!-- Generic entity modal (fields injected by app.js) -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">New</h2>
        <button class="icon-btn" data-close-modal>✕</button>
      </div>
      <form id="entityForm" class="modal-body">
        <input type="hidden" name="id" />
        <div id="modalFields" class="modal-fields"><!-- fields injected here --></div>
        <div class="modal-foot span-2">
          <button type="button" class="ghost-btn danger" id="deleteBtn" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" class="ghost-btn" data-close-modal>Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- "New" chooser menu -->
  <div class="modal-overlay" id="chooser" hidden>
    <div class="modal small" role="dialog" aria-modal="true" aria-labelledby="chooserTitle">
      <div class="modal-head">
        <h2 id="chooserTitle">Create something new</h2>
        <button class="icon-btn" data-close-modal>✕</button>
      </div>
      <div class="chooser-grid">
        <button class="chooser-btn" data-new="client"><span>🤝</span> Client</button>
        <button class="chooser-btn" data-new="project"><span>📁</span> Project</button>
        <button class="chooser-btn" data-new="task"><span>✅</span> Task</button>
        <button class="chooser-btn" data-new="invoice"><span>💰</span> Invoice</button>
        <button class="chooser-btn" data-new="goal"><span>🎯</span> Goal</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
