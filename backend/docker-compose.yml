services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadengine}
      POSTGRES_DB: ${POSTGRES_DB:-leadengine}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadengine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-leadengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadengine}
      POSTGRES_DB: ${POSTGRES_DB:-leadengine}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"

volumes:
  pgdata:
