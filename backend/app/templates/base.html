<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title|default("Lead Engine") }}</title>
  <style>
    :root {
      --bg: #0f1720; --panel: #17222e; --panel2: #1e2b3a; --line: #2b3a4d;
      --ink: #e7eef6; --muted: #93a4b8; --accent: #3ea6ff;
      --hot: #ef5350; --warm: #ffa726; --cold: #78909c; --good: #66bb6a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.top { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header.top .brand { font-weight: 700; font-size: 18px; }
    header.top .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .card .n { font-size: 30px; font-weight: 700; }
    .card .l { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--panel); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    tr:hover td { background: var(--panel2); }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.hot { background: rgba(239,83,80,.18); color: var(--hot); }
    .pill.warm { background: rgba(255,167,38,.18); color: var(--warm); }
    .pill.cold { background: rgba(120,144,156,.2); color: var(--cold); }
    .score { font-weight: 700; }
    .toolbar { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
    .btn { background: var(--accent); color: #04121f; padding: 8px 14px; border-radius: 8px; font-weight: 600; border: 0; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    .kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; }
    .kv dt { color: var(--muted); }
    .offer { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .offer h4 { margin: 0 0 4px; }
    .bar { height: 8px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">🎯 Global Connects <small>Lead Engine</small></div>
    <nav><a href="/">Dashboard</a> &nbsp;·&nbsp; <a href="/docs">API docs</a></nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
